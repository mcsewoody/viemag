<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VIEMAG Admin</title>
<!-- Cache-busting: GitHub Pages/Cloudflare cache every file under /admin for
     4 hours (Cache-Control: max-age=14400), so without a version query string
     staff can keep running yesterday's admin.js for up to 4h after a deploy —
     this is what made the version number in the brand label invisible right
     after it shipped. Bump every "?v=" below to match ADMIN_VERSION (in
     admin.js) whenever admin.js/schema.js/i18n.js/field-i18n.js/option-i18n.js/
     admin.css change — a different query string is a different cached URL, so
     this forces a fresh fetch instead of waiting out the 4-hour cache. -->
<link rel="stylesheet" href="admin.css?v=1.05">
</head>
<body>

<div id="loginScreen" class="login-wrap" style="display:none">
  <div class="lang-picker-login">
    <select id="loginLangPicker"></select>
  </div>
  <div class="login-card">
    <h1 id="loginTitle">Sign in</h1>
    <form id="loginForm">
      <label id="loginEmailLabel" for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" required>
      <label id="loginPasswordLabel" for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
      <button id="loginSubmit" type="submit">Sign in</button>
      <div id="loginError" class="login-error"></div>
    </form>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <div class="sidebar">
    <div class="brand" id="brandLabel">VIEMAG ADMIN</div>
    <nav id="sidebarNav"></nav>
  </div>
  <div>
    <div class="topbar">
      <span class="user-email" id="userEmail"></span>
      <span class="sync-status" id="syncStatus"></span>
      <button id="syncNowBtn">Sync to website</button>
      <select id="langPicker"></select>
      <button id="signOutBtn">Sign out</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" integrity="sha384-faMlYZUtkJj+Sh6Bmu/L0GzPcraRWN6CW+9RH3GUrK/Z0WS9tgaNNt0tHiLxsbdb" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="config.js?v=1.05"></script>
<script src="i18n.js?v=1.05"></script>
<script src="schema.js?v=1.05"></script>
<script src="field-i18n.js?v=1.05"></script>
<script src="option-i18n.js?v=1.05"></script>
<script src="admin.js?v=1.05"></script>
</body>
</html>
