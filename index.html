<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIEMAG — Phụ kiện nam châm cho lái xe & bàn làm việc</title>
    <meta
      name="description"
      content="VIEMAG magnetic accessory system for driving and desk work — a more secure magnetic hold and more dependable charging. Compatible with MagSafe-standard accessories, built to the Qi2 standard."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css?v=35" />
  </head>
  <body data-page="home">
    <main>
      <!-- ===== HERO: full-bleed real driving scene, slogan overlaid ===== -->
      <section class="hero-full">
        <img
          class="hero-bg"
          id="heroImg"
          src="image/main.webp"
          width="1672"
          height="941"
          alt=""
          fetchpriority="high"
          decoding="async"
        />
        <div class="hero-scrim" aria-hidden="true"></div>
        <div class="container hero-full-inner">
          <div class="hero-copy">
            <span class="eyebrow"
              ><span class="dot"></span><span data-i18n="hero.eyebrow"></span
            ></span>
            <h1 class="display" data-i18n="hero.slogan"></h1>
            <p class="sub" data-i18n="hero.sub"></p>
            <div class="hero-ctas">
              <a
                class="btn btn-primary"
                id="heroShopee"
                href="#"
                target="_blank"
                rel="noopener"
                data-i18n="cta.shopee"
              ></a>
              <a
                class="btn btn-ghost hero-ghost"
                href="products.html"
                data-i18n="cta.explore"
              ></a>
            </div>
            <div class="hero-trust" id="heroTrust"></div>
          </div>
        </div>
      </section>

      <!-- ===== Pain points ===== -->
      <section class="section">
        <div class="container">
          <div class="section-head">
            <div class="kicker" data-i18n="pains.kicker"></div>
            <h2 class="section-title" data-i18n="pains.title"></h2>
            <p class="lede" data-i18n="pains.lede"></p>
          </div>
          <div class="pain-grid" id="painGrid"></div>
        </div>
      </section>

      <!-- ===== Buyer journey quick quad ===== -->
      <section class="section-tight journey-section">
        <div class="container">
          <div class="section-head journey-head">
            <div>
              <div class="kicker" data-i18n="journey.kicker"></div>
              <h2 class="section-title" data-i18n="journey.title"></h2>
              <p class="lede" data-i18n="journey.lede"></p>
            </div>
          </div>
          <!-- One card per buying state. Card 02 deep-links into the accessory line
           via ?cat= (products.html reads it) so "add the missing part" does not
           dump the whole catalogue on someone who already owns a mount. -->
          <div class="journey-grid" id="journeyGrid">
            <a class="journey-card primary" href="scenarios.html">
              <span class="journey-step">01</span>
              <span class="journey-icon" id="jIcon1"></span>
              <h3 data-i18n="journey.1.title"></h3>
              <p data-i18n="journey.1.desc"></p>
              <span class="journey-link" data-i18n="journey.1.cta"></span>
            </a>
            <a class="journey-card" href="products.html?cat=accessory">
              <span class="journey-step">02</span>
              <span class="journey-icon" id="jIcon2"></span>
              <h3 data-i18n="journey.2.title"></h3>
              <p data-i18n="journey.2.desc"></p>
              <span class="journey-link" data-i18n="journey.2.cta"></span>
            </a>
            <!-- why-viemag.html, not #painGrid. The anchor pointed at the pain
                 section, which sits ABOVE this one, so "See what goes wrong"
                 scrolled the visitor backwards into copy they had just read
                 while the other three cards all moved forward. why-viemag.html
                 answers the same question and then keeps going: its four
                 commitments (steadier / more secure / longer-lasting / safer
                 charging) map one-to-one onto the three failures named on this
                 card. If the journey block is ever moved above the pain
                 section, #painGrid becomes the better target again. -->
            <a class="journey-card" href="why-viemag.html">
              <span class="journey-step">03</span>
              <span class="journey-icon" id="jIcon3"></span>
              <h3 data-i18n="journey.3.title"></h3>
              <p data-i18n="journey.3.desc"></p>
              <span class="journey-link" data-i18n="journey.3.cta"></span>
            </a>
            <a class="journey-card quiet" href="insights.html">
              <span class="journey-step">04</span>
              <span class="journey-icon" id="jIcon4"></span>
              <h3 data-i18n="journey.4.title"></h3>
              <p data-i18n="journey.4.desc"></p>
              <span class="journey-link" data-i18n="journey.4.cta"></span>
            </a>
          </div>
        </div>
      </section>

      <!-- ===== 5 category lines (CAT-A…E) ===== -->
      <section class="section" style="background: var(--ivory)">
        <div class="container">
          <div class="section-head">
            <div class="kicker" data-i18n="cats.kicker"></div>
            <h2 class="section-title" data-i18n="cats.title"></h2>
            <p class="lede" data-i18n="cats.lede"></p>
          </div>
          <div class="cat-grid" id="catGrid"></div>
        </div>
      </section>

      <!-- ===== Ecosystem framing ===== -->
      <section class="section system-section">
        <div class="container">
          <div class="system-grid">
            <div>
              <div class="kicker" data-i18n="system.kicker"></div>
              <h2 class="section-title" data-i18n="system.title"></h2>
              <p class="lede" data-i18n="system.lede"></p>
            </div>
            <div class="system-map" aria-hidden="true">
              <div class="system-node phone" data-i18n="system.phone"></div>
              <div class="system-line"></div>
              <div class="system-node core" data-i18n="system.core"></div>
              <div class="system-branches">
                <span data-i18n="system.car"></span>
                <span data-i18n="system.desk"></span>
                <span data-i18n="system.travel"></span>
                <span data-i18n="system.studio"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Featured products ===== -->
      <section class="section">
        <div class="container">
          <div
            class="section-head"
            style="
              display: flex;
              justify-content: space-between;
              align-items: flex-end;
              gap: 24px;
              flex-wrap: wrap;
            "
          >
            <div>
              <div class="kicker" data-i18n="feat.kicker"></div>
              <h2 class="section-title" data-i18n="feat.title"></h2>
              <p class="lede" data-i18n="feat.lede"></p>
            </div>
            <a
              class="btn btn-ghost"
              href="products.html"
              data-i18n="cta.viewAll"
            ></a>
          </div>
          <div class="prod-grid" id="featGrid"></div>
        </div>
      </section>

      <!-- ===== Latest insights / news ===== -->
      <section class="section home-news-section">
        <div class="container">
          <div
            class="section-head"
            style="
              display: flex;
              justify-content: space-between;
              align-items: flex-end;
              gap: 24px;
              flex-wrap: wrap;
            "
          >
            <div>
              <div class="kicker" data-i18n="news.kicker"></div>
              <h2 class="section-title" data-i18n="news.title"></h2>
              <p class="lede" data-i18n="news.lede"></p>
            </div>
            <a
              class="btn btn-ghost"
              href="insights.html"
              data-i18n="news.cta"
            ></a>
          </div>
          <div class="home-news-grid" id="homeNewsGrid"></div>
        </div>
      </section>

      <!-- ===== 6 scenarios (S1–S6) ===== -->
      <section class="section scenario-strip">
        <div class="container">
          <div class="section-head">
            <div class="kicker" data-i18n="scns.kicker"></div>
            <h2 class="section-title" data-i18n="scns.title"></h2>
            <p class="lede" data-i18n="scns.lede"></p>
          </div>
          <div class="scn-grid" id="scnGrid"></div>
        </div>
      </section>

      <!-- ===== Quality proof ===== -->
      <section class="section">
        <div class="container">
          <div class="proof-band">
            <div class="proof-inner">
              <div>
                <h2 data-i18n="proof.title"></h2>
                <p data-i18n="proof.desc"></p>
                <p class="proof-note" data-i18n="proof.note"></p>
                <div style="margin-top: 24px">
                  <a
                    class="btn btn-light"
                    href="why-viemag.html"
                    data-i18n="proof.cta"
                  ></a>
                </div>
              </div>
              <div class="proof-list" id="proofList"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- The "After-sales promise" strip lived here until 2026-09-21. It listed
           the warranty, the defect exchange and local-language support — the
           same three promises, word for word from the same interpolated terms,
           that the hero already states above the fold and the footer states
           again at the bottom. Three times on one page does not make a promise
           three times more believable; it just makes the page longer.
           Hero (first impression) and footer (where people look when they get
           suspicious) are kept. The trust.* keys stay in js/i18n.js, so the
           block can come back if it is given something the other two do not
           already say — a returns process, a response time, a service address.
           NOTE: trust.4 ("Install guides") was the one item unique to this
           strip and is currently not shown anywhere on the home page. -->

      <!-- ===== Dealer entry ===== -->
      <section class="section-tight">
        <div class="container">
          <div class="dealer-cta">
            <div>
              <h2 data-i18n="dealer.title"></h2>
              <p data-i18n="dealer.desc"></p>
              <div class="tagline" data-i18n="dealer.tagline"></div>
            </div>
            <a
              class="btn btn-primary"
              href="dealers.html"
              data-i18n="cta.dealer"
            ></a>
          </div>
        </div>
      </section>
    </main>

    <script src="js/data-loader.js?v=34"></script>
    <script src="js/i18n.js?v=33"></script>
    <script>
      window.renderPage = function ({
        t,
        icon,
        art,
        productCard,
        categoryCard,
        scenarioCard,
        insightCard,
        published,
      }) {
        const DB = window.DB;
        document.getElementById("heroShopee").href = DB.config.shopeeUrl;
        document.getElementById("heroShopee").innerHTML = `${VIEMAG.brandIcon("shopee")}${t("cta.shopee")}`;
        document.getElementById("heroImg").alt = t("hero.imgAlt");

        document.getElementById("heroTrust").innerHTML = [
          ["shield", "hero.trust1"],
          ["swap", "hero.trust2"],
          ["chat", "hero.trust3"],
        ]
          .map(([ic, key]) => `<span class="item">${icon(ic)}${t(key)}</span>`)
          .join("");

        ["box", "magnet", "wave", "guide"].forEach((ic, i) => {
          document.getElementById("jIcon" + (i + 1)).innerHTML = icon(ic);
        });

        /* Pain cards. `bullets` is listed per card rather than probed, because t()
     returns the key itself for a missing string — a card with fewer lines would
     otherwise render "pains.3.c" on the page. */
        const PAINS = [
          { img: "image/khong-qua-noi-o-ga.webp", bulletIcons: ["wave", "magnet"], bullets: ["a", "b"] },
          { img: "image/nang-nong.webp", bulletIcons: ["thermo", "car", "close"], bullets: ["a", "b", "c"] },
          { img: "image/guc-dau.webp", bulletIcons: ["cycle", "car"], bullets: ["a", "b"] },
        ];
        document.getElementById("painGrid").innerHTML = PAINS.map((p, idx) => {
          const i = idx + 1;
          return `
    <div class="pain-card pain-compare reveal">
      <div class="pain-art"><img src="${p.img}" alt="${t("pains." + i + ".title")}" loading="lazy" decoding="async"></div>
      <p class="pain-badge">${t("pains." + i + ".badge")}</p>
      <h3>${t("pains." + i + ".title")}</h3>
      <div class="pain-copy">
        <b class="pain-label">${t("pains.float")}</b>
        <ul>${p.bullets.map((b, bIdx) => `<li><span class="pain-bullet-icon">${icon(p.bulletIcons[bIdx])}</span><span>${t("pains." + i + "." + b)}</span></li>`).join("")}</ul>
      </div>
      <div class="fix">
        <b class="pain-label">${icon("check")}${t("pains.fixLabel")}</b>
        <p>${t("pains." + i + ".fix")}</p>
      </div>
    </div>`;
        }).join("");

        document.getElementById("catGrid").innerHTML = DB.categories
          .slice()
          .sort((a, b) => a.sort - b.sort)
          .map(categoryCard)
          .join("");

        /* Published only. A badge is an editorial flag, not a sales state, so
           filtering on the badge alone put a `future` SKU (no price, no buy
           button) in the middle of the row — a dead cell inside the one block
           on the page whose whole job is "here is something you can buy".
           Badged products lead; the rest of the catalogue tops the row up so a
           thin badge list does not leave a 4-column grid with two holes in it.
           Capped at 4 = exactly one full row, with "View all products" sitting
           right beside the heading for anyone who wants more. */
        const isFeatured = (p) =>
          p.badge === "bestseller" || p.badge === "new";
        const featured = published
          .filter(isFeatured)
          .concat(published.filter((p) => !isFeatured(p)))
          .slice(0, 4);
        document.getElementById("featGrid").innerHTML = featured
          .map(productCard)
          .join("");

        const insights = (DB.insights || [])
          .slice()
          .sort((a, b) =>
            String(b.date || "").localeCompare(String(a.date || "")),
          )
          .slice(0, 4);
        document.getElementById("homeNewsGrid").innerHTML = insights
          .map(insightCard)
          .join("");

        document.getElementById("scnGrid").innerHTML = DB.scenarios
          .map(scenarioCard)
          .join("");

        document.getElementById("proofList").innerHTML = DB.tests
          .map(
            (x) => `
    <div class="proof-item">${icon(x.icon)}<div><b>${window.VIEMAG.tf(x.name)}</b><span>${window.VIEMAG.tf(x.desc)}</span></div></div>`,
          )
          .join("");

      };
    </script>
    <script src="js/main.js?v=36"></script>
  </body>
</html>
