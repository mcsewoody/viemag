<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — VIEMAG</title>
  <meta name="description" content="">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=21">
</head>
<body data-page="products" data-keep-title="1">

<main>
  <div class="container">
    <nav class="breadcrumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div id="pdp"></div>
    <section class="pdp-section" id="pdpFaqWrap" style="display:none">
      <h2 data-i18n="pdp.faqTitle"></h2>
      <div class="faq-list" id="pdpFaqList"></div>
    </section>
    <section class="pdp-section" id="relatedWrap" style="display:none">
      <h2 data-i18n="pdp.related"></h2>
      <div class="prod-grid" id="relatedGrid"></div>
    </section>
  </div>
</main>

<script src="js/data-loader.js?v=18"></script>
<script src="js/i18n.js?v=18"></script>
<script>
window.renderPage = function ({ t, tf, icon, art, thumb, productCard, claimHtml, lines, catById, esc, stars, money, reportList, gallery, faqItem, richText, stripTags }) {
  const DB = window.DB;
  const sku = new URLSearchParams(location.search).get('sku');
  /* An unknown ?sku= must NOT silently fall back to some other product: a stale
     QR code or a discontinued SKU would show a customer the wrong item at the
     wrong price. Show "not found" instead. */
  const p = DB.products.find((x) => x.sku === sku);
  const box = document.getElementById('pdp');
  if (!p) { box.innerHTML = `<div class="empty-state">${t('pdp.notFound')}</div>`; return; }

  /* cat can legitimately be undefined — a product whose category was hidden or
     deleted exports category:null. Dereferencing it used to throw here, which
     aborted renderPage BEFORE the reveal-observer was set up, leaving the whole
     page blank (not just the breadcrumb). */
  const cat = catById(p.category);
  /* Staff can override the <title> and description per product; blank (the normal
     case) composes them from the name and claim, so nobody has to fill 19 SKUs
     x 4 languages in before the page has a usable title. */
  document.title = stripTags(tf(p.seoTitle)) || `${tf(p.name)} — VIEMAG`;
  const descEl = document.querySelector('meta[name="description"]');
  if (descEl) descEl.setAttribute('content', stripTags(tf(p.seoDesc)) || stripTags(tf(p.claim)));
  document.getElementById('crumbs').innerHTML =
    `<a href="index.html">VIEMAG</a><span>/</span>` +
    `<a href="products.html">${t('nav.products')}</a><span>/</span>` +
    (cat ? `<a href="products.html?cat=${cat.id}">${esc(tf(cat.name))}</a><span>/</span>` : '') +
    `<span>${esc(tf(p.name))}</span>`;

  const future = p.status === 'future';

  /* Highlights are the checkable facts only. The claim used to lead this list
     as well as sitting in the hero above it — tolerable while every claim was
     one line, but once claims became multi-line (one selling point per line in
     /admin) the same five sentences appeared twice on one screen, separated
     only by the price. The hero now carries the selling copy; this list carries
     Qi status, mounting and warranty terms. */
  const hl = [];
  if (p.qi !== 'none') hl.push({ icon: 'bolt', cls: 'highlight-charge', text: t('qi.' + p.qi) });
  if ((p.mount || []).length) hl.push({ icon: 'magnet', cls: 'highlight-mount', text: `${t('pdp.spec.mount')}: ${(p.mount).map((m) => t('mount.' + m)).join(' · ')}` });
  /* This SKU's own terms, falling back to the site-wide policy. Before
     2026-07-29 the numbers were hard-coded into five languages, so the
     warranty_months / defect_exchange_days fields in /admin did nothing. */
  hl.push({ icon: 'shield', cls: 'highlight-warranty', text: t('hero.trust1', { m: p.warranty || DB.config.warrantyMonths }) });
  hl.push({ icon: 'swap', cls: 'highlight-exchange', text: t('hero.trust2', { d: p.exchange || DB.config.exchangeDays }) });

  /* What ships in the box. Absent for most SKUs — a mount that ships on its own
     has nothing to list — so the whole block disappears rather than rendering an
     empty heading, the same rule the FAQ and related sections follow.
     tf() picks the active language and falls back the same way every other
     translatable field does, so a product translated into only some languages
     still shows something rather than nothing. Simplified Chinese arrives via
     the runtime T2S pass over the rendered text, not from a fifth column. */
  function accessoryBlock(p) {
    /* The exporter already split these on newlines, but a staffer who typed
       "• Adapter ring x1" left the bullet character in the text — and the list
       below draws its own check icon. lines() strips it so the row shows one
       marker, not two. */
    const items = (tf(p.accessories) || []).map((x) => lines(x)[0] || '').filter(Boolean);
    if (!items.length) return '';
    return `
      <div class="spec-block">
        <h3>${t('pdp.accessories')}</h3>
        <ul class="bullet-list accessory-list">
          ${items.map((x) => `<li>${icon('check')}<span>${esc(x)}</span></li>`).join('')}
        </ul>
      </div>`;
  }

  function productInfoContent(p) {
    const body = richText(tf(p.article));
    const img = p.articleImage || '';
    if (!body && !img) return `<p class="pdp-tab-empty"></p>`;
    return `
      ${img ? `<figure class="pdp-article-media"><img src="${esc(img)}" alt="${esc(tf(p.name))}" loading="lazy"></figure>` : ''}
      ${body ? `<div class="rich-text">${body}</div>` : ''}`;
  }

  function technicalDetailsContent(p, specRows) {
    return `
      <div class="pdp-technical-grid pdp-spec-simple">
        <div class="spec-block spec-main">
          <table aria-label="${esc(t('pdp.specs'))}">${specRows}</table>
          ${p.spec ? `<p class="spec-download"><a href="${esc(p.spec)}" target="_blank" rel="noopener">${icon('external')}${t('pdp.specSheet')}</a></p>` : ''}
        </div>
        ${accessoryBlock(p)}
        <details class="spec-extra">
          <summary>${t('pdp.compat')}</summary>
          <p>${t('pdp.compatText')}</p>
        </details>
        <details class="spec-extra evidence-block">
          <summary>${t('pdp.evidence')}</summary>
          ${reportList(p)}
        </details>
      </div>`;
  }

  function productTabsBlock(p, specRows) {
    return `
      <section class="pdp-section pdp-tabs reveal" aria-label="${esc(t('pdp.article'))}">
        <div class="pdp-tabbar" role="tablist">
          <button type="button" class="pdp-tab-btn active" role="tab" id="pdpTabInfo" aria-selected="true" aria-controls="pdpPanelInfo" data-tab="info">${t('pdp.article')}</button>
          <button type="button" class="pdp-tab-btn" role="tab" id="pdpTabSpecs" aria-selected="false" aria-controls="pdpPanelSpecs" data-tab="specs">${t('pdp.specs')}</button>
        </div>
        <div class="pdp-tab-panel active" role="tabpanel" id="pdpPanelInfo" aria-labelledby="pdpTabInfo" data-panel="info">
          ${productInfoContent(p)}
        </div>
        <div class="pdp-tab-panel" role="tabpanel" id="pdpPanelSpecs" aria-labelledby="pdpTabSpecs" data-panel="specs" hidden>
          ${technicalDetailsContent(p, specRows)}
        </div>
      </section>`;
  }

  function productFeatureHtml(value) {
    const rows = lines(value);
    if (!rows.length) return '';
    const parsed = rows.map((row) => {
      const m = /^(\d+)[.)]\s*(.+)$/.exec(row);
      return m ? m[2] : row;
    });
    if (parsed.length === 1) return `<p class="feature-copy">${esc(parsed[0])}</p>`;
    return `<ul class="feature-list bullets">${parsed.map((row) => `<li>${esc(row)}</li>`).join('')}</ul>`;
  }

  /* The Qi ID row only exists when there is an ID to show, and the exporter
     already withholds it unless qi_status is Certified — so a visitor never sees
     a certification number on a product that is merely compatible. An empty row
     would be worse than no row: it reads as "certified, number pending". */
  const specRows = [
    [t('pdp.spec.sku'), p.sku],
    /* Omitted entirely when the product mounts to nothing. A power bank showing
       "Mounting: —" reads as a missing spec rather than an inapplicable one. */
    ...((p.mount || []).length ? [[t('pdp.spec.mount'), p.mount.map((m) => t('mount.' + m)).join(' · ')]] : []),
    [t('pdp.spec.watt'), p.watt || '—'],
    [t('pdp.spec.qi'), t('qi.' + (p.qi || 'none'))],
    ...(p.qiId ? [[t('pdp.spec.qiId'), p.qiId]] : []),
  ].map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join('');
  const featureHtml = productFeatureHtml(tf(p.claim));

  box.innerHTML = `
  <div class="pdp">
    <div class="pdp-gallery">
      <div class="main" id="pdpMain">${thumb(p)}</div>
      ${gallery(p)}
    </div>
    <div class="pdp-info">
      <span class="sku">${cat ? esc(tf(cat.name)) + ' · ' : ''}${p.sku}</span>
      <h1>${esc(tf(p.name))}</h1>
      ${p.rating ? `<div class="rating"><span class="stars" aria-hidden="true">${stars(p.rating)}</span><b>${p.rating.toFixed(1)}</b><span>(${p.reviews})</span></div>` : ''}
      ${featureHtml ? `<div class="pdp-features">${featureHtml}</div>` : ''}
      ${p.status === 'discontinued'
        ? `<div class="notice" style="margin:20px 0">${t('pdp.discontinued')}</div>`
        : future
        ? `<div class="notice" style="margin:20px 0">${t('cats.soon')}</div>`
        : `<div class="price">${money(p.price)}</div>
           <div class="pdp-ctas">
             <a class="btn btn-primary btn-shopee" href="${p.shopee || DB.config.shopeeUrl}" target="_blank" rel="noopener">${icon('cart')}${t('cta.shopee')}</a>
             <a class="btn btn-ghost btn-dealer" href="dealers.html">${icon('phonecall')}${t('pdp.askDealer')}</a>
           </div>`}
      <ul class="bullet-list" aria-label="${t('pdp.highlights')}">
        ${hl.map((x) => `<li class="${esc(x.cls)}">${icon(x.icon)}<span>${esc(x.text)}</span></li>`).join('')}
      </ul>
    </div>
  </div>
  ${productTabsBlock(p, specRows)}`;

  /* Thumbnail strip: swap the main image. Bound after innerHTML, and only when
     the strip actually exists (a single-photo product has no strip). */
  const shots = box.querySelectorAll('.pdp-shot');
  if (shots.length) {
    const main = document.getElementById('pdpMain');
    shots.forEach((btn) => btn.addEventListener('click', () => {
      main.innerHTML = `<img src="${esc(btn.dataset.src)}" alt="${esc(tf(p.name))}">`;
      shots.forEach((b) => b.classList.toggle('active', b === btn));
    }));
  }

  box.querySelectorAll('.pdp-tab-btn').forEach((btn) => btn.addEventListener('click', () => {
    const name = btn.dataset.tab;
    box.querySelectorAll('.pdp-tab-btn').forEach((b) => {
      const active = b === btn;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    box.querySelectorAll('.pdp-tab-panel').forEach((panel) => {
      const active = panel.dataset.panel === name;
      panel.classList.toggle('active', active);
      panel.hidden = !active;
    });
  }));

  /* Product-specific FAQ. p.faqs holds faq_keys picked in /admin; unset means
     this product has no questions of its own and the global list on the support
     page covers it, so the section is simply absent rather than empty. */
  const ownFaqs = (p.faqs || []).map((k) => DB.faqs.find((f) => f.id === k)).filter(Boolean);
  if (ownFaqs.length) {
    document.getElementById('pdpFaqWrap').style.display = '';
    document.getElementById('pdpFaqList').innerHTML = ownFaqs.map(faqItem).join('');
  }

  /* Related products: hand-picked in /admin wins; with none set, fall back to
     the same ecosystem. The manual list was editable but ignored until
     2026-07-29, and the fallback matched on shared scenarios until 2026-08-16 —
     which stopped working when scenarios ceased to be a product field. Same
     ecosystem is a closer match anyway: it is what the SKU itself encodes, so
     two products that share it are genuinely the same kind of thing. Products in
     the same sub-category sort first, so a vent mount suggests other mounts
     before it suggests charging mounts. */
  const manual = (p.related || []).map((s) => DB.products.find((x) => x.sku === s && x.status === 'published')).filter(Boolean);
  const rel = manual.length ? manual.slice(0, 4)
    : DB.products
        .filter((x) => x.sku !== p.sku && x.status === 'published' && x.category === p.category)
        .sort((a, b) => (b.subCategory === p.subCategory) - (a.subCategory === p.subCategory))
        .slice(0, 4);
  if (rel.length) {
    document.getElementById('relatedWrap').style.display = '';
    document.getElementById('relatedGrid').innerHTML = rel.map(productCard).join('');
  }
};
</script>
<script src="js/main.js?v=21"></script>
</body>
</html>
