<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pairing guide — VIEMAG</title>
  <meta name="description" content="Curated VIEMAG sets by situation: driving, desk work, business travel, outdoors and trips, home, recording and creating.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body data-page="scenarios">

<main>
  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="scenarios.title"></h1>
      <p data-i18n="scenarios.sub"></p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container" id="scnRows"></div>
  </section>
</main>

<script src="js/data-loader.js?v=6"></script>
<script src="js/i18n.js?v=6"></script>
<script>
/* Curated editorial page, 2026-08-16 onwards.
   Scenarios used to be a per-product field that also drove a `?scn=` filter on
   the listing. That collapsed in practice — 14 of 20 products sat in S2, S1 held
   none — so with the V3 coding scheme the field went away and scenarios became
   what they were always better at: hand-picked stories with a hand-picked combo.
   Everything on this page now comes from the scenarios table alone; nothing here
   reads a product's own scenario tags, because products no longer have any. */
window.renderPage = function ({ t, tf, icon, esc, prodBySku }) {
  const DB = window.DB;
  document.getElementById('scnRows').innerHTML = DB.scenarios.map((s) => {
    const combo = (s.combo || []).map(prodBySku).filter(Boolean)
      .map((p) => `<a class="chip" href="product.html?sku=${encodeURIComponent(p.sku)}">${esc(tf(p.name))}</a>`).join(' ');
    return `
    <article class="scn-row reveal" id="${s.id}">
      <div class="art${s.img ? ' has-photo' : ''}">${
        /* A real photograph when one exists, the built-in icon otherwise. The
           hero_image_url column was editable in /admin and read by nobody until
           2026-07-29, so an uploaded photo simply never appeared. */
        s.img ? `<img src="${esc(s.img)}" alt="${esc(tf(s.name))}" loading="lazy">` : icon(s.icon)
      }</div>
      <div>
        <h2>${esc(tf(s.name))}</h2>
        <p>${esc(tf(s.desc))}</p>
        ${tf(s.pain) ? `<p class="scn-pain"><b>${t('scns.pain')}</b> ${esc(tf(s.pain))}</p>` : ''}
        ${combo ? `<p class="filter-label" style="margin-bottom:8px">${t('scns.combo')}</p><div class="combo">${combo}</div>` : ''}
        <a class="btn btn-ghost btn-sm" href="products.html">${t('cta.explore')}</a>
      </div>
    </article>`;
  }).join('');
};
</script>
<script src="js/main.js?v=6"></script>
</body>
</html>
