<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — VIEMAG</title>
  <meta name="description" content="Browse the full VIEMAG magnetic accessory lineup: car mounts, Qi2-standard charging mounts, desk and travel chargers, magnetic accessories.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">

<main>
  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="products.title"></h1>
      <p data-i18n="products.sub"></p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <p class="filter-label" data-i18n="filter.byCat"></p>
      <div class="filter-bar" id="catFilter"></div>
      <p class="filter-label" data-i18n="filter.byPersona"></p>
      <div class="filter-bar" id="personaFilter"></div>
      <div class="prod-grid" id="prodGrid" style="margin-top:24px"></div>
      <div class="empty-state" id="emptyState" style="display:none" data-i18n="products.empty"></div>
    </div>
  </section>
</main>

<script src="js/data-loader.js"></script>
<script src="js/i18n.js"></script>
<script>
window.renderPage = function ({ t, tf, productCard, catById, stripTags }) {
  const DB = window.DB;
  const params = new URLSearchParams(location.search);
  let curCat = params.get('cat') || 'all';
  /* Persona is the second axis of the information architecture (CLAUDE.md), and
     products carry their own persona tags. Until 2026-07-29 that column was
     editable in /admin and read by nobody: the persona cards linked to a
     hard-coded list of categories instead.

     There was a third filter here — by scenario — removed 2026-08-16 with the V3
     coding scheme. It filtered on a product field whose values had collapsed:
     14 of 20 products sat in S2 (so `?scn=S2` returned nearly the whole
     catalogue), S1 held none (so its page was always empty), and two products
     had been left blank entirely. Scenarios now live only as curated editorial
     on scenarios.html. */
  let curPersona = params.get('persona') || 'all';

  const catBar = document.getElementById('catFilter');
  const personaBar = document.getElementById('personaFilter');
  const grid = document.getElementById('prodGrid');
  const empty = document.getElementById('emptyState');

  function drawFilters() {
    catBar.innerHTML = `<button data-v="all" class="${curCat === 'all' ? 'active' : ''}">${t('filter.all')}</button>` +
      DB.categories.map((c) =>
        `<button data-v="${c.id}" class="${curCat === c.id ? 'active' : ''}">${tf(c.name)}</button>`).join('');
    personaBar.innerHTML = `<button data-v="all" class="${curPersona === 'all' ? 'active' : ''}">${t('filter.all')}</button>` +
      DB.personas.map((pe) =>
        `<button data-v="${pe.id}" class="${curPersona === pe.id ? 'active' : ''}">${tf(pe.name)}</button>`).join('');
    catBar.querySelectorAll('button').forEach((b) => b.onclick = () => { curCat = b.dataset.v; sync(); });
    personaBar.querySelectorAll('button').forEach((b) => b.onclick = () => { curPersona = b.dataset.v; sync(); });
  }

  /* When the listing is filtered to one category, use that category's own title
     and description if staff wrote them. The seo_title/seo_description columns
     were Vietnamese-only and unread until 2026-07-29; they are four languages now
     and blank stays blank, falling back to the generic listing title. */
  function applyCategoryMeta() {
    const c = curCat !== 'all' ? catById(curCat) : null;
    const title = c && stripTags(tf(c.seoTitle));
    const desc = c && stripTags(tf(c.seoDesc));
    document.title = title || `${stripTags(t('products.title'))} — VIEMAG`;
    const el = document.querySelector('meta[name="description"]');
    if (el) el.setAttribute('content', desc || (c ? stripTags(tf(c.desc)) : stripTags(t('products.sub'))));
  }

  function sync() {
    const p = new URLSearchParams();
    if (curCat !== 'all') p.set('cat', curCat);
    if (curPersona !== 'all') p.set('persona', curPersona);
    history.replaceState(null, '', 'products.html' + (p.toString() ? '?' + p : ''));
    drawFilters(); draw(); applyCategoryMeta();
  }

  function draw() {
    const list = DB.products.filter((p) =>
      (curCat === 'all' || p.category === curCat) &&
      (curPersona === 'all' || (p.personas || []).includes(curPersona)));
    /* published first, future last */
    list.sort((a, b) => (a.status === 'future') - (b.status === 'future'));
    grid.innerHTML = list.map(productCard).join('');
    empty.style.display = list.length ? 'none' : 'block';
  }

  drawFilters(); draw(); applyCategoryMeta();
};
</script>
<script src="js/main.js"></script>
</body>
</html>
